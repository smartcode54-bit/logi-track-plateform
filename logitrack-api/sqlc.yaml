              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  # T11: file_objects (presign, commit, storage.gc) and the evidence tokens of trip_records / standby_records,
  # all under db.WithSystem (internal/storage is on the allow-list of Appendix C §C.3.2).
  - name: storage
