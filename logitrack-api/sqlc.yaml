# sqlc v1.31.1 (developer-spec.md §2.4): make sqlc writes the code, make gen-check runs `sqlc diff`
# and `sqlc vet`. The schema is the goose chain (sqlc reads only the Up sections). Each domain adds
# one block with its queries next to its repo package; the go options below are the project defaults.
# omit_unused_structs: a package gets the models of the tables its queries use, not all 85 (T04).
version: "2"
sql:
  - name: platform-db
    engine: postgresql
    schema: migrations
    queries: internal/platform/db/queries
    gen:
      go:
        package: dbq
        out: internal/platform/db/dbq
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
  # T05: auth reads and writes identity rows under db.WithSystem (Appendix C §C.4). uuid, timestamptz and citext
  # map to google/uuid, time and string so the service never handles pgtype wrappers.
  - name: auth
    engine: postgresql
    schema: migrations
    queries: internal/auth/queries
    gen:
      go:
        package: authdb
        out: internal/auth/authdb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
  # security_events has one writer (Appendix C §C.4.13): security.Append in the caller's transaction.
  - name: security
    engine: postgresql
    schema: migrations
    queries: internal/security/queries
    gen:
      go:
        package: securitydb
        out: internal/security/securitydb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
