# shellcheck shell=bash disable=SC2034
# Constants of the staging VM kit (deploy/vm, developer-spec.md §17.4): sourced by provision.sh, deploy.sh,
# rollout.sh and run-app.sh, and read line by line (kit_name=value) by ecosystem.config.cjs. These are
# shell variables of the kit, not environment variables of any program, and none is a secret: values a
# program reads live in the VM's .env (env.vm.example) or in ecosystem.config.cjs.

# The dedicated Linux user and the tree of the deployment (releases/<git-sha>, current, shared/).
kit_user=logitrack
kit_root=/opt/logitrack
# The node of the existing pm2 apps on the VM (root's nvm node runs n8n and is never used).
kit_node_dir=/opt/node-v24.14.0

# Public host names (Cloudflare proxied, origin certificate *.showkhun.co) and the ssh destination.
kit_web_host=logi.showkhun.co
kit_api_host=logi-api.showkhun.co
kit_ssh_host=showkhun.co

# Loopback ports, all inside the free range 3300-3310 of the shared VM. nginx proxies only to the web
# (3300) and the api's public listener (3302); nothing ever proxies to the internal listener (3301).
kit_web_port=3300
kit_api_internal_port=3301
kit_api_public_port=3302
kit_api_metrics_port=3303
kit_worker_metrics_port=3304
kit_scheduler_metrics_port=3305

# Data services: the server's own PostgreSQL 18 cluster, and two containers of this kit bound to 127.0.0.1
# (the server's native Redis on 6379 belongs to other apps).
kit_pg_addr=127.0.0.1:5432
kit_pg_db=logitrack
kit_redis_port=6381
kit_amqp_port=5674
kit_amqp_mgmt_port=15674
kit_redis_image=redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
kit_rabbitmq_image=rabbitmq:4.3.6-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95

# The Cloudflare origin certificate already on the VM (SAN *.showkhun.co).
kit_tls_cert=/etc/ssl/certs/showkhun.co.pem
kit_tls_key=/etc/ssl/private/showkhun.co.key

# Releases kept under releases/ (the current one included).
kit_keep_releases=3

# The web build: logitrack-web/Dockerfile with a glibc node of the VM's major version, because the
# standalone output runs on the VM's node, not in the alpine image (optional native packages such as
# sharp are traced for the build platform's libc).
kit_web_node_image=node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
