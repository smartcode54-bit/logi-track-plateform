# Managed by logitrack-api/deploy/vm (provision.sh); do not edit on the server. Included at the http level
# (conf.d); it only defines the log format the two logitrack vhosts use.
# The path is logged without its query string and without the referer, so signed media URLs
# (X-LT-Signature), SSE tickets and other query values never reach the access log. The error log is the
# vhosts' business: it records the full request line on an upstream failure, so the locations whose URI
# carries a credential log errors at crit only (logi.showkhun.co.conf, logi-api.showkhun.co.conf).
log_format logitrack '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent" $request_time';
# Evidence links carry a bearer token in the path itself: only the status, with the path replaced.
log_format logitrack_evidence '$remote_addr - [$time_local] "$request_method /evidence/- $server_protocol" '
                              '$status $body_bytes_sent "$http_user_agent" $request_time';
