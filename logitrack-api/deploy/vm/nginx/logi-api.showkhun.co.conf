# Managed by logitrack-api/deploy/vm (provision.sh); do not edit on the server.
# logi-api.showkhun.co: the api's public listener only (127.0.0.1:3302): mobile, auth, signed postbacks,
# evidence, local storage objects and /healthz (internal/platform/ingress.PublicPrefixes). The listener
# itself answers 404 to anything else; this vhost is the second fence, as the Caddy site of
# API_PUBLIC_DOMAIN is in compose (deploy/Caddyfile). Nothing ever proxies to the internal listener (3301).

server {
    listen 80;
    listen [::]:80;
    server_name logi-api.showkhun.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logi-api.showkhun.co;

    # Cloudflare origin certificate of the VM (SAN *.showkhun.co).
    ssl_certificate /etc/ssl/certs/showkhun.co.pem;
    ssl_certificate_key /etc/ssl/private/showkhun.co.key;

    include /etc/nginx/snippets/logitrack-cloudflare-realip.conf;

    # = UPLOAD_MAX_BYTES (10485760); JSON bodies stay under the api's own 4 MiB limit.
    client_max_body_size 10m;
    autoindex off;
    server_tokens off;

    # The access log drops query strings (logitrack-log-format.conf). The error log writes the whole request
    # line and the upstream URI, query included, whenever the upstream fails (connection refused while pm2
    # restarts the api, timeouts, 413): the locations whose URI carries a credential therefore log errors at
    # crit only, and their failures show as 502/504/413 in the access log and in the api's own logs.
    access_log /var/log/nginx/logitrack-api.access.log logitrack;
    error_log /var/log/nginx/logitrack-api.error.log;

    # Mobile server-sent events (ticket form, R42; the ticket is in the query): no buffering, no compression,
    # long reads.
    location = /v1/mobile/events {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3302;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        error_log /var/log/nginx/logitrack-api.error.log crit;
    }

    # Evidence links carry a bearer token that never expires (EVIDENCE_TOKEN_TTL_DAYS=0) in the path or in
    # ?k=: the access log records the status with the path replaced by /evidence/-, the error log nothing.
    location ~ ^/evidence(/|$) {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3302;
        access_log /var/log/nginx/logitrack-api.access.log logitrack_evidence;
        error_log /var/log/nginx/logitrack-api.error.log crit;
    }

    # Local storage objects: signed URLs (X-LT-Expires, X-LT-Signature in the query).
    location ~ ^/media(/|$) {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3302;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        error_log /var/log/nginx/logitrack-api.error.log crit;
    }

    location ~ ^/(v1/mobile|v1/auth|public/v1)(/|$) {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3302;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3302;
    }

    # Anything else: the Go listener's own 404 envelope (R48, Appendix B §B.1.5).
    location / {
        default_type "application/json; charset=utf-8";
        add_header X-Request-Id $request_id always;
        return 404 '{"error":{"code":"not_found","message":"resource not found","details":{},"requestId":"$request_id"}}';
    }
}
