# Managed by logitrack-api/deploy/vm (provision.sh); do not edit on the server.
# Upstream headers of every logitrack location. X-Forwarded-For is set (not appended): $remote_addr is
# already the client address (logitrack-cloudflare-realip.conf), and the api trusts the header only from
# 127.0.0.1 (TRUSTED_PROXY_CIDRS), so a client cannot smuggle an address in. HTTP/1.1 with an empty
# Connection header keeps upstream connections reusable and lets server-sent events stream.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
