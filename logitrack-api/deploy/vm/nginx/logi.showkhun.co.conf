# Managed by logitrack-api/deploy/vm (provision.sh); do not edit on the server.
# logi.showkhun.co: the web (Next.js standalone server + BFF on 127.0.0.1:3300) and /media/ (the local
# storage backend's object route on the api's public listener, 127.0.0.1:3302, path unchanged; owner-
# approved /media group, developer-spec.md §9.11). Nothing here reaches the api's internal listener (3301):
# the browser never calls Go, the BFF does (GO_API_INTERNAL_URL).

server {
    listen 80;
    listen [::]:80;
    server_name logi.showkhun.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logi.showkhun.co;

    # Cloudflare origin certificate of the VM (SAN *.showkhun.co).
    ssl_certificate /etc/ssl/certs/showkhun.co.pem;
    ssl_certificate_key /etc/ssl/private/showkhun.co.key;

    include /etc/nginx/snippets/logitrack-cloudflare-realip.conf;

    # = UPLOAD_MAX_BYTES (10485760): the web's uploads through the BFF (/api/go/v1/uploads/local/...) and
    # the driver app's signed PUT /media/...; request buffering stays on (nginx's default), so a slow
    # uplink is absorbed here before the upstream sees the body.
    client_max_body_size 10m;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/logitrack-web.access.log logitrack;
    error_log /var/log/nginx/logitrack-web.error.log;

    # Server-sent events through the BFF: no buffering, no compression, long reads (25 s pings).
    location = /api/go/v1/events {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3300;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Local storage objects: GET/HEAD downloads and signed PUT uploads on the api's public listener. Go
    # answers 404 for a directory (never an index) and checks every signature.
    location /media/ {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3302;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        include /etc/nginx/snippets/logitrack-proxy.conf;
        proxy_pass http://127.0.0.1:3300;
        # Local uploads through the BFF may take up to the 5-minute upload timeout of the api.
        proxy_read_timeout 300s;
    }
}
