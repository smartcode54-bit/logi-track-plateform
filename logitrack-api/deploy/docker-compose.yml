# logitrack-api local stack (developer-spec.md §15, issues T02 and TW2). Run through the Makefile:
#   make env dev-keys up        # first run
#   make up EDGE=1              # adds web (Next.js standalone) and caddy (deploy/Caddyfile)
# Every value is interpolated from logitrack-api/.env (`--env-file .env`); nothing here is a secret.
# Each Go service receives exactly the §16.1 names whose consumer column lists it (checked by
# `make env-check`), so api/worker/scheduler see only DATABASE_URL and seed sees all three DB URLs (R66, R87);
# web receives exactly the web-server names and is built with web-public names only; caddy the caddy names.
