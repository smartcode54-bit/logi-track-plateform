x-go: &go
  image: logitrack-api:${API_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  networks: [backend]
  volumes: ["./dev-secrets:/run/secrets/logitrack:ro"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq-init: { condition: service_completed_successfully }
    minio-init: { condition: service_completed_successfully }
    migrate: { condition: service_completed_successfully }

x-one-shot: &one-shot
  <<: *go
  restart: "no"
  profiles: [tools]
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "timezone=UTC"]
    # PGDATA of postgres:18 images is /var/lib/postgresql/18/docker; mount the parent (R34).
    volumes: ["pgdata:/var/lib/postgresql", "./postgres-init:/docker-entrypoint-initdb.d:ro"]
    ports: ["127.0.0.1:5432:5432"]
    networks: [backend]
    # Probe over TCP: the temporary server that runs postgres-init/ listens on no address,
    # so it never counts as healthy before the init scripts have finished.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      retries: 30
      start_period: 30s
      start_interval: 1s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    ports: ["127.0.0.1:6379:6379"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # Fixed node name (rabbit@rabbitmq): with the random container hostname a recreate
    # starts an empty node and orphans queued and dead-lettered messages.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-}
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  # Loads deploy/rabbitmq-definitions.json (Appendix B §B.5; generated from internal/platform/mq)
  # through the management API. The worker re-asserts the same topology at start (T10).
  rabbitmq-init:
    image: curlimages/curl:8.22.0
    entrypoint: ["/bin/sh", "/init/rabbitmq-init.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-}
    volumes:
      - ./rabbitmq:/init:ro
      - ./rabbitmq-definitions.json:/defs/rabbitmq-definitions.json:ro
    depends_on: { rabbitmq: { condition: service_healthy } }
    networks: [backend]

  # MinIO built from source by Chainguard: the official minio/minio images are no longer
  # published (Docker Hub and quay return no manifest). Pinned by digest; RELEASE.2026-09-22.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOWED_ORIGINS:-}
    volumes: ["miniodata:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    networks: [backend, edge]

  # Creates both buckets, anonymous download on S3_PUBLIC_BUCKET/app_releases/ only, the
  # 30-day expiry on cache/, and the application user (S3_ACCESS_KEY_ID) limited to the two buckets.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:5feb4dcc570e7578f82e6c84384849e6557d005fb9b06f714c63f7184883b13f
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes: ["./minio:/init:ro"]
    depends_on: { minio: { condition: service_started } }
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    networks: [backend]

  api:
    <<: *go
    command: ["/app/bin/api"]
    environment: *env-api
    # Internal (8080) and public (8081) listeners are published on loopback for local work only;
    # Caddy (profile edge) fronts the public listener and the prod override publishes neither.
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      retries: 12

  worker:
    <<: *go
    command: ["/app/bin/worker"]
    environment: *env-worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      retries: 12

  scheduler:
    <<: *go
    command: ["/app/bin/scheduler"]
    environment: *env-scheduler
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      retries: 12

  # Schema gate (R59, R66): api, worker and scheduler start only after this exits 0. Locally the
  # whole chain applies at once; production runs `migrate up-to 9` and `migrate apply 11` (0011+ ship
  # ahead of the held 0010) until the P1 runbook's `migrate up` (T24, R88).
  migrate:
    <<: *go
    restart: "no"
    entrypoint: ["/app/bin/migrate"]
    command: ["up"]
    environment: *env-migrate
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    <<: *one-shot
    entrypoint: ["/app/bin/seed"]
    command: ["--profile", "${SEED_PROFILE:-smoke}"]
    environment: *env-seed
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  etl:
    <<: *one-shot
    entrypoint: ["/app/bin/etl"]
    environment: *env-etl
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  mocks:
    image: wiremock/wiremock:3.13.2-alpine
    profiles: [mocks]
    command: ["--port", "8080", "--global-response-templating"]
    volumes: ["./mocks:/home/wiremock:ro"]
    ports: ["127.0.0.1:8089:8080"]
    networks: [backend]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [obs]
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
    networks: [backend]

  # Next.js standalone server (logitrack-web/Dockerfile, repo-root context). The browser reaches it
  # only through Caddy at WEB_DOMAIN; 127.0.0.1:3001 is for debugging.
  web:
    image: logitrack-web:${WEB_IMAGE_TAG:-local}
    profiles: [edge]
    build:
      context: ../..
      dockerfile: logitrack-web/Dockerfile
      args: *web-build-args
    environment: *env-web
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      api: { condition: service_healthy }
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      retries: 12
      start_period: 10s

  # Edge proxy (deploy/Caddyfile): WEB_DOMAIN -> web, API_PUBLIC_DOMAIN -> the api public listener
  # only, MEDIA_DOMAIN -> MinIO, :8090 -> /public/v1/* for the tunnel. Never the internal listener.
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [edge, tunnel]
    environment: *env-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports: ["80:80", "443:443"]
    depends_on:
      api: { condition: service_started }
      minio: { condition: service_started }
    networks: [edge]
    # The admin API listens on the container's loopback only.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      retries: 12

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [caddy]
    networks: [edge]

networks:
  backend: {}
  edge: {}

volumes:
  pgdata: {}
  redisdata: {}
  rabbitdata: {}
  miniodata: {}
  caddydata: {}
  caddyconfig: {}
