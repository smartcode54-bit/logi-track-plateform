name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ (github.event_name == 'workflow_run' && 'dev') || inputs.environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # DEV — auto after CI passes on main
  # ─────────────────────────────────────────────
  build-dev:
    name: Build (Dev)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    defaults:
      run:
        working-directory: logitrack-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Write dev env
        run: echo "${{ secrets.ENV_DEV_WEB }}" > .env.production

      - name: Build
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dev
          path: logitrack-web/out
          retention-days: 1

  deploy-dev:
    name: Deploy → DEV
    needs: build-dev
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://logi-track-wrt-dev.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dev
          path: logitrack-web/out

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write functions env (DEV)
        run: echo "${{ secrets.FUNCTIONS_ENV_DEV }}" > functions/.env.logi-track-wrt-dev
        working-directory: logitrack-web

      - name: Deploy hosting + functions + Firestore rules (DEV)
        working-directory: logitrack-web
        run: firebase deploy --only hosting,functions,firestore --project logi-track-wrt-dev

  # ─────────────────────────────────────────────
  # Production — manual trigger only
  # ─────────────────────────────────────────────
  build-prod:
    name: Build (Prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    defaults:
      run:
        working-directory: logitrack-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Write prod env
        run: echo "${{ secrets.ENV_PROD_WEB }}" > .env.production

      - name: Build
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-prod
          path: logitrack-web/out
          retention-days: 1

  deploy-prod:
    name: Deploy → PROD
    needs: build-prod
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://logitrack-prod.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-prod
          path: logitrack-web/out

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write functions env (PROD)
        run: echo "${{ secrets.FUNCTIONS_ENV_PROD }}" > functions/.env.logitrack-prod
        working-directory: logitrack-web

      - name: Deploy hosting + functions + Firestore rules (PROD)
        working-directory: logitrack-web
        run: firebase deploy --only hosting,functions,firestore --project logitrack-prod --config firebase.prod.json
