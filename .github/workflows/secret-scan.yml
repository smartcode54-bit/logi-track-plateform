# secret-scan: gitleaks over the commits of every push and pull request of mv-go and mv-go-**
# (developer-spec.md §16.5 rule 6, §17.2; issue T14). Findings are redacted in the log.
# R90: no trigger on main, which is live production.
name: secret-scan

on:
  push:
    branches: [mv-go, 'mv-go-**']
  pull_request:
    branches: [mv-go, 'mv-go-**']

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks over the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/secret-scan.sh
