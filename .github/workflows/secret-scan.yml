# secret-scan: gitleaks over the commits of every push and pull request of mv-go and mv-go-**
# (developer-spec.md §16.5 rule 6, §17.2; issue T14). Findings are redacted in the log. The commits
# under review cannot switch a finding off (no .gitleaks.toml, .gitleaksignore or gitleaks:allow),
# merge commits are scanned against their first parent, and an incomplete scan fails.
# R90: no trigger on main, which is live production.
name: secret-scan

on:
  push:
    branches: [mv-go, 'mv-go-**']
  pull_request:
    branches: [mv-go, 'mv-go-**']

permissions:
  contents: read

# One group per commit on mv-go, so no push's scan is cancelled or replaced while pending: the next
# push scans only its own range. Elsewhere a newer push supersedes the older run.
concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref == 'refs/heads/mv-go' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/mv-go' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A throwaway repository: an inline gitleaks:allow, an allow-list file, a conflict resolution
      # or a skipped commit must not turn a fake token into "no leaks found".
      - name: Self-test of the scanner
        run: .github/scripts/secret-scan-selftest.sh

      - name: gitleaks over the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/secret-scan.sh
