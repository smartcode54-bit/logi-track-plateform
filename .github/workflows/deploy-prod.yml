# Deploy web to Firebase production (runs on Linux to avoid Windows paths[1] bug)
name: Deploy Production

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  # push:
  #   branches: [main]  # Uncomment to deploy on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # No pnpm/action-setup "version" key — avoids mismatch with package.json packageManager on any branch.
      - name: Enable corepack (pnpm from package.json)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.production
        run: |
          set -e
          if [ -n "${ENV_PROD_WEB:-}" ]; then
            printf '%s\n' "$ENV_PROD_WEB" > logitrack-web/.env.production
          elif [ -n "${NEXT_PUBLIC_FIREBASE_API_KEY:-}" ] && [ -n "${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}" ]; then
            {
              echo "NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}"
              echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
              echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
              echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}"
              echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
              echo "NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}"
              if [ -n "${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}" ]; then
                echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}"
              fi
            } > logitrack-web/.env.production
          else
            echo "::error::No Firebase prod env. Add Secret ENV_PROD_WEB = full envs/.env.prod.web, OR Secrets FIREBASE_PROD_API_KEY … FIREBASE_PROD_APP_ID (six keys), OR Variables NEXT_PUBLIC_FIREBASE_* ."
            exit 1
          fi
        env:
          ENV_PROD_WEB: ${{ secrets.ENV_PROD_WEB }}
          # Prod-only: do not use repo Variables NEXT_PUBLIC_* here (same names as dev would conflict).
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_PROD_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROD_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROD_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROD_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_PROD_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_PROD_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_PROD_MEASUREMENT_ID }}

      - name: Verify Firebase client env for Next build
        run: |
          f=logitrack-web/.env.production
          for key in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            if ! grep -qE "^[[:space:]]*${key}=.+" "$f"; then
              echo "::error::Missing or empty ${key} in .env.production (from ENV_PROD_WEB). Compare with envs/.env.prod.web.example."
              exit 1
            fi
          done

      - name: Build
        run: pnpm run build
        working-directory: logitrack-web

      # Docker-based actions cannot use working-directory; use the CLI on a run step instead.
      - name: Deploy to Firebase
        run: npx firebase-tools@13 deploy --config firebase.prod.json --project logitrack-prod --non-interactive
        working-directory: logitrack-web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
