# Deploy web to Firebase production (runs on Linux to avoid Windows paths[1] bug)
name: Deploy Production

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  # push:
  #   branches: [main]  # Uncomment to deploy on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # No pnpm/action-setup "version" key — avoids mismatch with package.json packageManager on any branch.
      - name: Enable corepack (pnpm from package.json)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.production
        run: printf '%s\n' "$ENV_PROD_WEB" > logitrack-web/.env.production
        env:
          ENV_PROD_WEB: ${{ secrets.ENV_PROD_WEB }}

      - name: Build
        run: pnpm run build
        working-directory: logitrack-web

      # Docker-based actions cannot use working-directory; use the CLI on a run step instead.
      - name: Deploy to Firebase
        run: npx firebase-tools@13 deploy --config firebase.prod.json --project logitrack-prod --non-interactive
        working-directory: logitrack-web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
