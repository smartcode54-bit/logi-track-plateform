name: CI

# mv-go and mv-go-** run the same web checks (developer-spec.md §17.3, T14); the main entries are
# unchanged (R90). Deploy follows CI runs whose head branch is main: pushes to main, but also a pull
# request whose head branch is named main, so the job refuse-main-head fails such a PR into mv-go
# and Deploy skips it. main reaches mv-go only through a mv-go-sync-<date> branch (§17.5).
on:
  push:
    branches: [main, mv-go, 'mv-go-**']
    paths:
      - 'logitrack-web/**'
      - 'shared-docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, mv-go, 'mv-go-**']
    paths:
      - 'logitrack-web/**'
      - 'shared-docs/**'
      - 'pnpm-lock.yaml'

# On mv-go one group per commit, so a newer merge never cancels the run of the previous one (go-ci's
# web-ci waits for each commit's run). Every other ref, main included, keeps its group ci-<ref>.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/mv-go' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Deploy's workflow_run filter `branches: [main]` matches the head branch of the CI run, so a
  # successful run of a pull request from main into mv-go would deploy main to Firebase DEV. Failing
  # the run makes Deploy skip it. Skipped on every other run, main's included.
  refuse-main-head:
    name: Refuse main as the head of a PR outside main
    if: github.event_name == 'pull_request' && github.head_ref == 'main' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail
        env:
          BASE: ${{ github.base_ref }}
        run: |
          echo "::error title=CI::a pull request from main into $BASE would start Deploy (workflow_run branches: [main] matches the head branch). Merge origin/main into a mv-go-sync-<date> branch cut from mv-go and open the PR from that branch (developer-spec.md §17.5)."
          exit 1

  check:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: logitrack-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Create dummy env file
        run: |
          touch .env.production
          echo "NEXT_PUBLIC_DUMMY=ci" >> .env.production

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

  # developer-spec.md §17.3 item 3 (TW2): the web ships as a Next.js standalone server. Builds with
  # dummy public values and sentinel server-only values, then scripts/check-standalone.mjs asserts
  # server.js, no traced .env file, no server-only value in the browser-facing output (.next/static
  # and the prerendered .next/server/app and .next/server/pages pages) and only allow-listed
  # NEXT_PUBLIC_ names. No secrets are used.
  build-standalone:
    name: Standalone build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: logitrack-web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_GOOGLE_OIDC_CLIENT_ID: ci-dummy-oidc-client
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy-bucket
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-dummy-app-id
      GO_API_INTERNAL_URL: http://ci-sentinel-go-internal.invalid:8080
      GO_API_INTERNAL_TIMEOUT_MS: ci-sentinel-timeout
      SESSION_COOKIE_DOMAIN: ci-sentinel-cookie.invalid
      SESSION_COOKIE_SECURE: ci-sentinel-secure
      WEB_PUBLIC_ORIGIN: http://ci-sentinel-origin.invalid
      JWT_ISSUER: ci-sentinel-issuer
      JWT_AUDIENCE: ci-sentinel-audience
      JWT_ACCESS_TTL: ci-sentinel-access-ttl
      REFRESH_TOKEN_TTL_WEB: ci-sentinel-refresh-ttl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build (output standalone)
        run: pnpm run build

      - name: Check the standalone output
        run: pnpm run check:standalone
