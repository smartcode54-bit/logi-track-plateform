# Deploy web to Firebase development (logi-track-wrt-dev)
name: Deploy Development

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.production (dev)
        run: printf '%s\n' "$ENV_DEV_WEB" > logitrack-web/.env.production
        env:
          ENV_DEV_WEB: ${{ secrets.ENV_DEV_WEB }}

      - name: Build
        run: pnpm run build
        working-directory: logitrack-web

      - name: Deploy to Firebase (dev)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --project logi-track-wrt-dev --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        working-directory: logitrack-web
