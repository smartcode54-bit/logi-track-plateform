# Deploy web to Firebase development (logi-track-wrt-dev)
name: Deploy Development

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Omit "version" so pnpm matches root package.json "packageManager" only
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.production (dev)
        run: printf '%s\n' "$ENV_DEV_WEB" > logitrack-web/.env.production
        env:
          ENV_DEV_WEB: ${{ secrets.ENV_DEV_WEB }}

      - name: Build
        run: pnpm run build
        working-directory: logitrack-web

      # Docker-based actions cannot use working-directory; use the CLI on a run step instead.
      - name: Deploy to Firebase (dev)
        run: npx firebase-tools@13 deploy --project logi-track-wrt-dev --non-interactive
        working-directory: logitrack-web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
