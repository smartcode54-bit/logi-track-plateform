# Deploy web to Firebase development (logi-track-wrt-dev)
name: Deploy Development

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No pnpm/action-setup "version" key — avoids mismatch with package.json packageManager on any branch.
      - name: Enable corepack (pnpm from package.json)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.production (dev)
        run: printf '%s\n' "$ENV_DEV_WEB" > logitrack-web/.env.production
        env:
          ENV_DEV_WEB: ${{ secrets.ENV_DEV_WEB }}

      - name: Build
        run: pnpm run build
        working-directory: logitrack-web

      # Docker-based actions cannot use working-directory; use the CLI on a run step instead.
      - name: Deploy to Firebase (dev)
        run: npx firebase-tools@13 deploy --project logi-track-wrt-dev --non-interactive
        working-directory: logitrack-web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
