# Deploy web to Firebase development (logi-track-wrt-dev)
name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      env_dev_web_b64:
        description: "Optional. Base64 of envs/.env.dev.web (UTF-8). Use when repo Secrets/Variables are not set. Git bash: base64 -w0 envs/.env.dev.web"
        required: false
        default: ""
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only FORCE_* here — never put ENV_DEV_WEB at job level (would show as empty in logs).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # No pnpm/action-setup "version" key — avoids mismatch with package.json packageManager on any branch.
      - name: Enable corepack (pnpm from package.json)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Secrets never print values; empty-looking env: lines are normal. These booleans confirm what is configured.
      - name: Diagnose Firebase env sources (no secret values)
        run: |
          echo "ENV_DEV_WEB secret set: ${{ secrets.ENV_DEV_WEB != '' }}"
          echo "FIREBASE_DEV_API_KEY secret set: ${{ secrets.FIREBASE_DEV_API_KEY != '' }}"
          echo "FIREBASE_DEV_PROJECT_ID secret set: ${{ secrets.FIREBASE_DEV_PROJECT_ID != '' }}"
          echo "VAR NEXT_PUBLIC_FIREBASE_API_KEY set: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY != '' }}"
          echo "workflow_dispatch env_dev_web_b64 non-empty: ${{ github.event.inputs.env_dev_web_b64 != '' }}"

      # Option A: workflow input env_dev_web_b64 (base64 file) — Option B: Secret ENV_DEV_WEB — Option C: vars || FIREBASE_DEV_* secrets
      - name: Create .env.production (dev)
        run: |
          set -e
          if [ -n "${ENV_DEV_WEB_B64_INPUT:-}" ]; then
            if ! printf '%s' "$ENV_DEV_WEB_B64_INPUT" | base64 -d > logitrack-web/.env.production; then
              echo "::error::env_dev_web_b64 is not valid base64. On Linux/Git Bash: base64 -w0 envs/.env.dev.web"
              exit 1
            fi
            if ! grep -qE '^[[:space:]]*NEXT_PUBLIC_FIREBASE_API_KEY=' logitrack-web/.env.production; then
              echo "::error::Decoded file missing NEXT_PUBLIC_FIREBASE_API_KEY. Use UTF-8 .env without BOM."
              exit 1
            fi
          elif [ -n "${ENV_DEV_WEB:-}" ]; then
            printf '%s\n' "$ENV_DEV_WEB" > logitrack-web/.env.production
          elif [ -n "${NEXT_PUBLIC_FIREBASE_API_KEY:-}" ] && [ -n "${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}" ]; then
            {
              echo "NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}"
              echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
              echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
              echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}"
              echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
              echo "NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}"
              if [ -n "${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}" ]; then
                echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}"
              fi
            } > logitrack-web/.env.production
          else
            echo "::error::No Firebase web env. See job log step 'Diagnose Firebase env sources' (all false = nothing configured). Fix: add repo Secrets on THIS repo, or run workflow again and paste base64 into input env_dev_web_b64."
            exit 1
          fi
        env:
          ENV_DEV_WEB_B64_INPUT: ${{ github.event.inputs.env_dev_web_b64 }}
          ENV_DEV_WEB: ${{ secrets.ENV_DEV_WEB }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || secrets.FIREBASE_DEV_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_DEV_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || secrets.FIREBASE_DEV_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_DEV_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_DEV_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || secrets.FIREBASE_DEV_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_DEV_MEASUREMENT_ID }}

      - name: Verify Firebase client env for Next build
        run: |
          f=logitrack-web/.env.production
          for key in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            if ! grep -qE "^[[:space:]]*${key}=.+" "$f"; then
              echo "::error::Missing or empty ${key} in .env.production (from ENV_DEV_WEB). Compare with envs/.env.dev.web.example."
              exit 1
            fi
          done

      - name: Build
        run: pnpm run build
        working-directory: logitrack-web

      # Docker-based actions cannot use working-directory; use the CLI on a run step instead.
      - name: Deploy to Firebase (dev)
        run: npx firebase-tools@13 deploy --project logi-track-wrt-dev --non-interactive
        working-directory: logitrack-web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
